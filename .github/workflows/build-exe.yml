name: Build exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller pytest
      - name: Test
        run: python -m pytest -q tests
      - name: Build
        run: pyinstaller --onefile --windowed --name JUXK-PS2 main.py
      - uses: actions/upload-artifact@v4
        with:
          name: JUXK-PS2-exe
          path: dist/JUXK-PS2.exe
