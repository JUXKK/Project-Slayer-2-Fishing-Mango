name: Build exe

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller pytest
      - name: Test
        run: python -m pytest -q tests
      - name: Build
        run: pyinstaller --onefile --windowed --name JUXK-PS2 main.py
      - uses: actions/upload-artifact@v4
        with:
          name: JUXK-PS2-exe
          path: dist/JUXK-PS2.exe
      - name: Publish to Releases (tag "latest")
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/JUXK-PS2.exe \
            --target "$GITHUB_SHA" --prerelease \
            --title "JUXK PS2 (latest build)" \
            --notes "Download JUXK-PS2.exe below and double-click it. Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}."
